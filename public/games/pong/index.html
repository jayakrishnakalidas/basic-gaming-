<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Neon Pong</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; user-select: none; }
    body { background: #090d16; color: #fff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
    .header { display: flex; justify-content: space-around; width: 100%; max-width: 360px; margin-bottom: 10px; font-weight: 700; font-size: 1.2rem; }
    canvas { background: #161f31; border: 2px solid #ec4899; border-radius: 12px; box-shadow: 0 0 20px rgba(236, 72, 153, 0.3); max-width: 95vw; }
    .tip { margin-top: 10px; color: #94a3b8; font-size: 0.85rem; }
  </style>
</head>
<body>

  <div class="header">
    <div style="color:#14b8a6">AI: <span id="aiScore">0</span></div>
    <div style="color:#6366f1">You: <span id="playerScore">0</span></div>
  </div>

  <canvas id="pongCanvas" width="360" height="500"></canvas>
  <div class="tip">Drag touch screen or use Left/Right keys</div>

  <script>
    const canvas = document.getElementById('pongCanvas');
    const ctx = canvas.getContext('2d');

    const paddleWidth = 80;
    const paddleHeight = 12;

    const player = { x: canvas.width / 2 - paddleWidth / 2, y: canvas.height - 25, score: 0 };
    const ai = { x: canvas.width / 2 - paddleWidth / 2, y: 15, score: 0 };
    const ball = { x: canvas.width / 2, y: canvas.height / 2, radius: 8, dx: 4, dy: -4 };

    function draw() {
      // Clear
      ctx.fillStyle = '#161f31';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Center dash line
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(0, canvas.height / 2);
      ctx.lineTo(canvas.width, canvas.height / 2);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.stroke();

      // Move Ball
      ball.x += ball.dx;
      ball.y += ball.dy;

      // Wall bounce
      if (ball.x - ball.radius < 0 || ball.x + ball.radius > canvas.width) {
        ball.dx *= -1;
      }

      // Player paddle collision
      if (ball.y + ball.radius >= player.y && ball.x >= player.x && ball.x <= player.x + paddleWidth) {
        ball.dy = -Math.abs(ball.dy) * 1.05; // speed up slightly
        let hitPos = (ball.x - (player.x + paddleWidth / 2)) / (paddleWidth / 2);
        ball.dx = hitPos * 6;
      }

      // AI paddle collision
      if (ball.y - ball.radius <= ai.y + paddleHeight && ball.x >= ai.x && ball.x <= ai.x + paddleWidth) {
        ball.dy = Math.abs(ball.dy) * 1.05;
        let hitPos = (ball.x - (ai.x + paddleWidth / 2)) / (paddleWidth / 2);
        ball.dx = hitPos * 6;
      }

      // AI movement logic
      const aiTarget = ball.x - paddleWidth / 2;
      ai.x += (aiTarget - ai.x) * 0.08;
      ai.x = Math.max(0, Math.min(canvas.width - paddleWidth, ai.x));

      // Scoring
      if (ball.y < 0) {
        player.score++;
        document.getElementById('playerScore').textContent = player.score;
        resetBall(1);
      } else if (ball.y > canvas.height) {
        ai.score++;
        document.getElementById('aiScore').textContent = ai.score;
        resetBall(-1);
      }

      // Draw Paddles
      // Player
      ctx.fillStyle = '#6366f1';
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#6366f1';
      ctx.fillRect(player.x, player.y, paddleWidth, paddleHeight);

      // AI
      ctx.fillStyle = '#14b8a6';
      ctx.shadowColor = '#14b8a6';
      ctx.fillRect(ai.x, ai.y, paddleWidth, paddleHeight);

      // Draw Ball
      ctx.fillStyle = '#ec4899';
      ctx.shadowColor = '#ec4899';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.shadowBlur = 0;
      requestAnimationFrame(draw);
    }

    function resetBall(dir) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.dx = (Math.random() > 0.5 ? 4 : -4);
      ball.dy = dir * 4;
    }

    // Touch controls
    window.addEventListener('touchmove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const touchX = e.touches[0].clientX - rect.left;
      player.x = touchX - paddleWidth / 2;
      player.x = Math.max(0, Math.min(canvas.width - paddleWidth, player.x));
    });

    window.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      player.x = mouseX - paddleWidth / 2;
      player.x = Math.max(0, Math.min(canvas.width - paddleWidth, player.x));
    });

    // Keyboard
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') player.x -= 30;
      if (e.key === 'ArrowRight') player.x += 30;
      player.x = Math.max(0, Math.min(canvas.width - paddleWidth, player.x));
    });

    draw();
  </script>
</body>
</html>
