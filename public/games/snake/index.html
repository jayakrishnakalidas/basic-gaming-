<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyber Snake</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; user-select: none; }
    body { background: #090d16; color: #fff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
    .header { display: flex; justify-content: space-between; width: 90%; max-width: 400px; margin-bottom: 10px; font-weight: 700; font-size: 1.1rem; }
    canvas { background: #161f31; border: 2px solid #6366f1; border-radius: 12px; box-shadow: 0 0 20px rgba(99, 102, 241, 0.3); max-width: 95vw; max-height: 55vh; }
    .controls { display: grid; grid-template-columns: repeat(3, 60px); grid-gap: 8px; margin-top: 15px; }
    .btn { background: rgba(99, 102, 241, 0.2); border: 1px solid #6366f1; color: #fff; font-size: 1.5rem; height: 50px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .btn:active { background: #6366f1; }
    .btn-up { grid-column: 2; }
    .btn-left { grid-column: 1; grid-row: 2; }
    .btn-down { grid-column: 2; grid-row: 2; }
    .btn-right { grid-column: 3; grid-row: 2; }
    .game-over { position: absolute; background: rgba(9, 13, 22, 0.9); padding: 20px 40px; border-radius: 16px; border: 1px solid #ec4899; text-align: center; display: none; }
    .game-over h2 { color: #ec4899; margin-bottom: 10px; font-size: 1.8rem; }
    .restart-btn { background: #ec4899; border: none; color: #fff; padding: 10px 20px; font-weight: bold; border-radius: 8px; margin-top: 15px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="header">
    <div>Score: <span id="score">0</span></div>
    <div>High: <span id="highScore">0</span></div>
  </div>

  <canvas id="gameCanvas" width="400" height="400"></canvas>

  <div class="controls">
    <div class="btn btn-up" id="btnUp">▲</div>
    <div class="btn btn-left" id="btnLeft">◄</div>
    <div class="btn btn-down" id="btnDown">▼</div>
    <div class="btn btn-right" id="btnRight">►</div>
  </div>

  <div class="game-over" id="gameOverModal">
    <h2>GAME OVER</h2>
    <p>Final Score: <span id="finalScore">0</span></p>
    <button class="restart-btn" onclick="resetGame()">Play Again</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const grid = 20;
    const count = canvas.width / grid;

    let snake = [{x: 10, y: 10}];
    let food = {x: 15, y: 15};
    let dx = 1, dy = 0;
    let score = 0;
    let highScore = localStorage.getItem('snake_high') || 0;
    document.getElementById('highScore').textContent = highScore;
    let gameLoop;
    let isGameOver = false;

    function draw() {
      if (isGameOver) return;

      // Move snake
      const head = {x: snake[0].x + dx, y: snake[0].y + dy};

      // Check wall crash
      if (head.x < 0 || head.x >= count || head.y < 0 || head.y >= count) {
        return endGame();
      }

      // Check self crash
      for (let i = 0; i < snake.length; i++) {
        if (snake[i].x === head.x && snake[i].y === head.y) {
          return endGame();
        }
      }

      snake.unshift(head);

      // Check food collision
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById('score').textContent = score;
        if (score > highScore) {
          highScore = score;
          localStorage.setItem('snake_high', highScore);
          document.getElementById('highScore').textContent = highScore;
        }
        spawnFood();
      } else {
        snake.pop();
      }

      // Render
      ctx.fillStyle = '#161f31';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Food
      ctx.fillStyle = '#ec4899';
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#ec4899';
      ctx.fillRect(food.x * grid + 2, food.y * grid + 2, grid - 4, grid - 4);

      // Draw Snake
      snake.forEach((part, index) => {
        ctx.fillStyle = index === 0 ? '#6366f1' : '#14b8a6';
        ctx.shadowColor = index === 0 ? '#6366f1' : '#14b8a6';
        ctx.fillRect(part.x * grid + 1, part.y * grid + 1, grid - 2, grid - 2);
      });
      ctx.shadowBlur = 0;
    }

    function spawnFood() {
      food.x = Math.floor(Math.random() * count);
      food.y = Math.floor(Math.random() * count);
    }

    function endGame() {
      isGameOver = true;
      clearInterval(gameLoop);
      document.getElementById('finalScore').textContent = score;
      document.getElementById('gameOverModal').style.display = 'block';
    }

    function resetGame() {
      snake = [{x: 10, y: 10}];
      dx = 1; dy = 0;
      score = 0;
      isGameOver = false;
      document.getElementById('score').textContent = 0;
      document.getElementById('gameOverModal').style.display = 'none';
      clearInterval(gameLoop);
      gameLoop = setInterval(draw, 100);
    }

    function changeDir(nx, ny) {
      if ((nx === -dx && nx !== 0) || (ny === -dy && ny !== 0)) return;
      dx = nx; dy = ny;
    }

    // Keyboard controls
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'w') changeDir(0, -1);
      if (e.key === 'ArrowDown' || e.key === 's') changeDir(0, 1);
      if (e.key === 'ArrowLeft' || e.key === 'a') changeDir(-1, 0);
      if (e.key === 'ArrowRight' || e.key === 'd') changeDir(1, 0);
    });

    // Touch D-Pad
    document.getElementById('btnUp').addEventListener('touchstart', (e) => { e.preventDefault(); changeDir(0, -1); });
    document.getElementById('btnDown').addEventListener('touchstart', (e) => { e.preventDefault(); changeDir(0, 1); });
    document.getElementById('btnLeft').addEventListener('touchstart', (e) => { e.preventDefault(); changeDir(-1, 0); });
    document.getElementById('btnRight').addEventListener('touchstart', (e) => { e.preventDefault(); changeDir(1, 0); });
    
    document.getElementById('btnUp').addEventListener('click', () => changeDir(0, -1));
    document.getElementById('btnDown').addEventListener('click', () => changeDir(0, 1));
    document.getElementById('btnLeft').addEventListener('click', () => changeDir(-1, 0));
    document.getElementById('btnRight').addEventListener('click', () => changeDir(1, 0));

    // Touch Swipe Support
    let touchStartX = 0, touchStartY = 0;
    canvas.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    });
    canvas.addEventListener('touchend', (e) => {
      const diffX = e.changedTouches[0].clientX - touchStartX;
      const diffY = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX > 30) changeDir(1, 0);
        else if (diffX < -30) changeDir(-1, 0);
      } else {
        if (diffY > 30) changeDir(0, 1);
        else if (diffY < -30) changeDir(0, -1);
      }
    });

    resetGame();
  </script>
</body>
</html>
